<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Zoya 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .gradient-background {
      background: #fce4ec;
      background: linear-gradient(165deg, #f8bbd9 0%, #fce4ec 25%, #faf0f5 50%, #fff5f8 100%);
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }
    .gradient-background::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle at 20% 80%, rgba(244, 143, 177, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(233, 30, 99, 0.08) 0%, transparent 50%);
      pointer-events: none;
    }
    .font-zoya {
      font-family: 'Great Vibes', cursive;
      color: #ad1457;
      text-shadow: 0 2px 20px rgba(173, 20, 87, 0.2);
    }
    .font-question {
      font-family: 'Cormorant Garamond', serif;
    }
    .card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      box-shadow: 0 25px 50px -12px rgba(190, 24, 93, 0.15),
                  0 0 0 1px rgba(255, 255, 255, 0.8) inset;
      border-radius: 24px;
      padding: 2.5rem;
    }
    .bounce2 {
      animation: bounce2 2s ease infinite;
    }
    @keyframes bounce2 {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-20px); }
      60% { transform: translateY(-10px); }
    }
    .name-glow {
      animation: name-glow 3s ease-in-out infinite;
    }
    @keyframes name-glow {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(233, 30, 99, 0.3)); }
      50% { filter: drop-shadow(0 0 30px rgba(233, 30, 99, 0.5)); }
    }
    .heart-float {
      position: absolute;
      font-size: 1.5rem;
      opacity: 0.4;
      animation: heart-float 6s ease-in-out infinite;
    }
    .heart-float:nth-child(1) { left: 10%; top: 15%; animation-delay: 0s; }
    .heart-float:nth-child(2) { right: 15%; top: 25%; animation-delay: 1s; }
    .heart-float:nth-child(3) { left: 20%; bottom: 20%; animation-delay: 2s; }
    .heart-float:nth-child(4) { right: 10%; bottom: 30%; animation-delay: 0.5s; }
    .heart-float:nth-child(5) { left: 50%; top: 10%; animation-delay: 1.5s; }
    @keyframes heart-float {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.35; }
      50% { transform: translateY(-15px) scale(1.1); opacity: 0.55; }
    }
    .img-frame {
      border-radius: 16px;
      box-shadow: 0 20px 40px -15px rgba(173, 20, 87, 0.25);
      border: 3px solid rgba(255, 255, 255, 0.9);
    }
    .btn-yes {
      background: linear-gradient(135deg, #43a047 0%, #2e7d32 100%);
      box-shadow: 0 4px 14px rgba(46, 125, 50, 0.4);
    }
    .btn-yes:hover { box-shadow: 0 6px 20px rgba(46, 125, 50, 0.5); }
    .btn-no {
      background: linear-gradient(135deg, #e53935 0%, #c62828 100%);
      box-shadow: 0 4px 14px rgba(198, 40, 40, 0.3);
    }
    .btn-no:hover { box-shadow: 0 6px 20px rgba(198, 40, 40, 0.4); }
    .btn-no-disabled {
      background: linear-gradient(135deg, #b0b0b0 0%, #9e9e9e 100%) !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1) !important;
      color: #757575 !important;
      opacity: 0.85;
    }
    .btn-no-disabled:hover {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1) !important;
      transform: none;
    }
  </style>
</head>
<body class="gradient-background">
  <span class="heart-float">💕</span>
  <span class="heart-float">💗</span>
  <span class="heart-float">💖</span>
  <span class="heart-float">💕</span>
  <span class="heart-float">💗</span>

  <div class="flex flex-col items-center justify-center min-h-screen p-4 relative z-10">
    <p class="font-question text-lg text-rose-700/80 tracking-widest uppercase mb-1">For My</p>
    <h1 class="font-zoya name-glow text-6xl sm:text-7xl mb-6">Zoya</h1>
    <div class="card flex flex-col items-center max-w-lg w-full">
      <img id="imageDisplay" src="./images/image1.gif" alt="Cute kitten with flowers" class="img-frame h-[280px] w-full object-cover mb-6" />
      <h2 id="valentineQuestion" class="font-question text-3xl sm:text-4xl font-semibold italic text-[#ad1457] my-2 text-center">Will you be my Valentine?</h2>
      <div class="flex gap-4 pt-5 items-center" id="responseButtons">
        <button id="yesButton"
          class="bounce2 btn-yes inline-flex items-center justify-center whitespace-nowrap rounded-xl text-[20px] font-medium text-white min-h-12 min-w-[75px] px-5 py-2.5 transition hover:scale-105 active:scale-95">
          Yes
        </button>
        <button id="noButton"
          class="btn-no inline-flex items-center justify-center whitespace-nowrap rounded-xl text-[20px] font-medium text-white h-12 min-w-[75px] w-auto px-5 py-2.5 transition hover:scale-105 active:scale-95">
          No
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/canvas-confetti.min.js"></script>
  <script>
    const yesButton = document.getElementById('yesButton');
    const noButton = document.getElementById('noButton');
    const imageDisplay = document.getElementById('imageDisplay');
    const valentineQuestion = document.getElementById('valentineQuestion');
    const responseButtons = document.getElementById('responseButtons');
  
    let noClickCount = 0;
    let buttonHeight = 48; // Starting height in pixels
    let buttonWidth = 80;
    let fontSize = 20; // Starting font size in pixels
    const imagePaths = [
      "./images/image1.gif",
      "./images/image2.gif",
      "./images/image3.gif",
      "./images/image4.gif",
      "./images/image5.gif",
      "./images/image6.gif",
      "./images/image7.gif"
    ];
  
    noButton.addEventListener('click', function() {
      if (noClickCount < 5) {
        noClickCount++;
        imageDisplay.src = imagePaths[noClickCount];
        buttonHeight += 35; // Increase height by 5px on each click
        buttonWidth += 35;
        fontSize += 25; // Increase font size by 1px on each click
        yesButton.style.height = `${buttonHeight}px`; // Update button height
        yesButton.style.width = `${buttonWidth}px`;
        yesButton.style.fontSize = `${fontSize}px`; // Update font size
        if (noClickCount < 6) {
          noButton.textContent = ["No", "Are you sure?", "Pookie please", "Don't do this to me :(", "You're breaking my heart", "I'm gonna cry..."][noClickCount];
          if (noClickCount === 5) {
            noButton.classList.remove('btn-no');
            noButton.classList.add('btn-no-disabled');
          }
        }
      }
    });
  
    yesButton.addEventListener('click', () => {
      imageDisplay.src = './images/image7.gif'; // Change to image7.gif
      valentineQuestion.textContent = "Zoya said yes!! 💕"; // Change the question text
      responseButtons.style.display = 'none'; // Hide both buttons
      confetti(); // Trigger confetti animation
    });
  </script>  
</body>
</html>
